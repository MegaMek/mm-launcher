name: "Request an Enhancement"
description: >
  Suggest a new launcher feature or an improvement to an existing one. Please check that nobody
  has asked for this already.
type: "Feature"
labels:
  - (RFE) Enhancement

body:
  - type: dropdown
    id: enhancement-type
    attributes:
      label: "What kind of request is this?"
      options:
        - "New feature"
        - "Improvement to an existing feature"
    validations:
      required: true

  - type: textarea
    id: brief-description
    attributes:
      label: "What would you like to see?"
      placeholder: "Describe the enhancement here..."
    validations:
      required: true

  - type: textarea
    id: proposed-use-cases
    attributes:
      label: "Why is it worth doing?"
      description: "What problem does it solve, and who does it help?"
      placeholder: "1. ...\n2. ..."

  - type: upload
    id: reference-files
    attributes:
      label: "Reference material"
      description: "Sketches or screenshots."
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.pdf,.txt"

  - type: input
    id: launcher-version
    attributes:
      label: "Launcher Version"
      description: "Which version you are using now, from the launcher's title bar."
      placeholder: "Example: 0.14.24"
    validations:
      required: true

  - type: checkboxes
    id: final-checks
    attributes:
      label: "Before you submit"
      options:
        - label: "This request only contains one idea, and I haven't already asked for it"
          required: true
        - label: "This is about the launcher, not about MegaMek, MegaMekLab or MekHQ"
          required: true
        - label: "I have discussed this on the MegaMek Discord (optional)"
