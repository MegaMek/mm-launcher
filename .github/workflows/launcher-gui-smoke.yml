name: Launcher desktop smoke tests (advisory)
run-name: Desktop UI checks - ${{ github.event_name }} (${{ github.head_ref || github.ref_name }})

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/launcher-gui-smoke.yml"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "src/**"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/launcher-gui-smoke.yml"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "src/**"
      - "scripts/**"
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: launcher-desktop-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-verification:
    name: Desktop check selection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run_desktop_tests: ${{ steps.ci-plan.outputs.run_desktop_tests }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine whether this push only records an already verified release
        id: ci-plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/launcher_release.py ci-plan

  desktop:
    needs: release-verification
    if: needs.release-verification.outputs.run_desktop_tests == 'true'
    name: Advisory desktop smoke - ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-2025
          - id: linux-x64
            os: ubuntu-24.04
          - id: macos-intel
            os: macos-15-intel
          - id: macos-apple-silicon
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:GITHUB_WORKSPACE 'build\test-temp'
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          $env:JAVA_TOOL_OPTIONS = "-Djava.io.tmpdir=$testTemp"
          .\gradlew.bat nativeGuiTest
      - name: Desktop tests on Linux with Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a ./gradlew nativeGuiTest
      - name: Desktop tests on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build/test-temp"
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=${GITHUB_WORKSPACE}/build/test-temp"
          ./gradlew nativeGuiTest
      - name: Upload advisory desktop reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MegaMek-Launcher-desktop-reports-${{ matrix.id }}
          path: |
            build/test-results/nativeGuiTest/**/*.xml
            build/reports/tests/nativeGuiTest/**
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
