name: Test launcher signing (no publication)
run-name: SignPath test-only rehearsal (${{ github.sha }})

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: launcher-test-signing
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.test.outputs.version }}
      commit: ${{ steps.test.outputs.commit }}
      organization_id: ${{ steps.test.outputs.organization_id }}
      project_slug: ${{ steps.test.outputs.project_slug }}
      artifact_configuration_slug: ${{ steps.test.outputs.artifact_configuration_slug }}
      certificate_sha256: ${{ steps.test.outputs.certificate_sha256 }}
    steps:
      - name: Reject nonofficial or nonmain dispatch before reading credentials
        run: |
          if [[ "$GITHUB_REPOSITORY" != MegaMek/mm-launcher ||
                "$GITHUB_REF" != refs/heads/main ||
                "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo 'Test signing requires manual dispatch from official main.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate official main and capture test-only signing settings
        id: test
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_TEST_CERTIFICATE_SHA256: ${{ vars.SIGNPATH_TEST_CERTIFICATE_SHA256 }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: python3 -B scripts/launcher_test_signing.py plan

  installers:
    needs: plan
    uses: ./.github/workflows/launcher-archives.yml
    with:
      source_commit: ${{ needs.plan.outputs.commit }}

  sign-test:
    needs: [plan, installers]
    runs-on: windows-2025
    timeout-minutes: 75
    outputs:
      artifact_id: ${{ steps.inspected.outputs.artifact-id }}
    env:
      TEST_VERSION: ${{ needs.plan.outputs.version }}
      TEST_COMMIT: ${{ needs.plan.outputs.commit }}
      TEST_CERTIFICATE_SHA256: ${{ needs.plan.outputs.certificate_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: MegaMek-Launcher-*-installers
          path: build/test-unsigned
          merge-multiple: true
      - name: Stage the exact tested MSI without preparing a release
        shell: pwsh
        run: |
          python -B scripts/launcher_signing.py prepare `
            --version "$env:TEST_VERSION" --commit "$env:TEST_COMMIT" `
            --source build/test-unsigned --assets build/test-assets `
            --signing-input build/test-signing-input --windows-signing signpath
      - name: Upload only the unsigned MSI for test-signing
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: TEST-ONLY-unsigned-msi-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test-signing-input/*.msi
          if-no-files-found: error
          retention-days: 14
      - name: Request self-signed test signing only
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ needs.plan.outputs.organization_id }}
          project-slug: ${{ needs.plan.outputs.project_slug }}
          signing-policy-slug: test-signing
          artifact-configuration-slug: ${{ needs.plan.outputs.artifact_configuration_slug }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          service-unavailable-timeout-in-seconds: 60
          output-artifact-directory: build/signpath-test-signed
      - name: Inspect test MSI identity, pinned signer and timestamp without installing
        shell: pwsh
        run: |
          . .\scripts\verify_launcher_test_signature.ps1
          $name = "MegaMek-Launcher-$env:TEST_VERSION-windows-x64.msi"
          Confirm-LauncherTestMsi `
            -UnsignedMsi "build\test-signing-input\$name" -SignedDirectory build\signpath-test-signed `
            -Version "$env:TEST_VERSION" -Commit "$env:TEST_COMMIT" `
            -CertificateSha256 "$env:TEST_CERTIFICATE_SHA256" -OutputDirectory build\test-signing-result
      - name: Retain test inspection for mandatory cryptographic verification
        id: inspected
        uses: actions/upload-artifact@v4
        with:
          name: TEST-ONLY-signpath-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test-signing-result/
          if-no-files-found: error
          retention-days: 14

  verify-test:
    needs: [plan, sign-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TEST_VERSION: ${{ needs.plan.outputs.version }}
      TEST_COMMIT: ${{ needs.plan.outputs.commit }}
      TEST_CERTIFICATE_SHA256: ${{ needs.plan.outputs.certificate_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.sign-test.outputs.artifact_id }}
          path: build/test-signing-result
          merge-multiple: true
      - name: Install missing test-only Authenticode verification tool
        run: |
          if ! command -v osslsigncode >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y osslsigncode
          fi
      - name: Verify signature and MSI digest using only the pinned test certificate
        run: |
          python3 -B scripts/launcher_test_signing.py verify \
            --version "$TEST_VERSION" --commit "$TEST_COMMIT" \
            --assets build/test-signing-result --certificate-sha256 "$TEST_CERTIFICATE_SHA256" \
            --tsa-certificates /etc/ssl/certs/ca-certificates.crt
      - name: Retain verified test-only result (do not distribute or install)
        uses: actions/upload-artifact@v4
        with:
          name: DO-NOT-INSTALL-test-signpath-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test-signing-result/
          if-no-files-found: error
          retention-days: 14
      - name: Report onboarding evidence without publication
        run: |
          {
            echo '## SignPath onboarding rehearsal passed'
            echo 'Policy: test-signing. Result: self-signed test artifact only.'
            echo 'No release, tag, candidate branch or version change was created.'
            echo 'Do not distribute or install this MSI; production signing remains separate.'
          } >> "$GITHUB_STEP_SUMMARY"
