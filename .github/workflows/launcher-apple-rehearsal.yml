name: "Maintenance: Test Apple signing (no publication)"
run-name: Apple signing rehearsal (${{ github.sha }})

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: launcher-apple-rehearsal
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.apple.outputs.version }}
      commit: ${{ steps.apple.outputs.commit }}
      team_id: ${{ steps.apple.outputs.team_id }}
      identity: ${{ steps.apple.outputs.identity }}
      key_id: ${{ steps.apple.outputs.key_id }}
      issuer_id: ${{ steps.apple.outputs.issuer_id }}
    steps:
      - name: Reject nonofficial or nonmain dispatch before reading credentials
        run: |
          if [[ "$GITHUB_REPOSITORY" != MegaMek/mm-launcher ||
                "$GITHUB_REF" != refs/heads/main ||
                "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo 'Apple rehearsal requires manual dispatch from official main.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test release tooling without network or publication
        run: python3 -B -m unittest discover -s scripts -p 'test_launcher_*.py'
      - name: Validate exact main and capture Apple rehearsal settings
        id: apple
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_APPLICATION_P12: ${{ secrets.APPLE_APPLICATION_P12 }}
          APPLE_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_APPLICATION_P12_PASSWORD }}
          APPLE_INSTALLER_P12: ${{ secrets.APPLE_INSTALLER_P12 }}
          APPLE_INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_P12_PASSWORD }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: python3 -B scripts/launcher_apple.py rehearsal-plan

  macos:
    needs: plan
    name: Apple rehearsal - ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-intel
            os: macos-15-intel
          - id: macos-apple-silicon
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    outputs:
      intel_artifact_id: ${{ steps.result.outputs.intel_artifact_id }}
      silicon_artifact_id: ${{ steps.result.outputs.silicon_artifact_id }}
    env:
      SOURCE_COMMIT: ${{ needs.plan.outputs.commit }}
      SOURCE_VERSION: ${{ needs.plan.outputs.version }}
      APPLE_TEAM_ID: ${{ needs.plan.outputs.team_id }}
      APPLE_SIGNING_IDENTITY: ${{ needs.plan.outputs.identity }}
      APPLE_NOTARY_KEY_ID: ${{ needs.plan.outputs.key_id }}
      APPLE_NOTARY_ISSUER_ID: ${{ needs.plan.outputs.issuer_id }}
      APPLE_PLATFORM: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test source before importing private credentials
        run: |
          mkdir -p "${RUNNER_TEMP}/launcher-rehearsal-tests"
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=${RUNNER_TEMP}/launcher-rehearsal-tests"
          ./gradlew "-PbuildIdentifier=$SOURCE_COMMIT" test
      - name: Import temporary Apple rehearsal credentials
        env:
          APPLE_APPLICATION_P12: ${{ secrets.APPLE_APPLICATION_P12 }}
          APPLE_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_APPLICATION_P12_PASSWORD }}
          APPLE_INSTALLER_P12: ${{ secrets.APPLE_INSTALLER_P12 }}
          APPLE_INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_P12_PASSWORD }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: |
          python3 -B scripts/launcher_apple.py rehearsal-setup \
            --version "$SOURCE_VERSION" --commit "$SOURCE_COMMIT"
      - name: Build the signed Mac installer without installing
        run: |
          ./gradlew "-PbuildIdentifier=$SOURCE_COMMIT" \
            "-PappleSigningIdentity=$APPLE_SIGNING_IDENTITY" \
            "-PappleSigningKeychain=$APPLE_SIGNING_KEYCHAIN" buildPkgInstaller
      - name: Notarize staple and verify the rehearsal package
        run: |
          python3 -B scripts/launcher_apple.py rehearsal-complete \
            --version "$SOURCE_VERSION" --commit "$SOURCE_COMMIT" --platform "$APPLE_PLATFORM"
      - name: Remove temporary Apple credentials and restore keychains
        if: always()
        run: python3 -B scripts/launcher_apple.py cleanup
      - name: Stage only the exact rehearsal package checksum and record
        run: |
          mkdir build/apple-rehearsal-platform
          name="MegaMek-Launcher-$SOURCE_VERSION-$APPLE_PLATFORM.pkg"
          cp "build/distributions/$name" "build/distributions/$name.sha256" \
            "build/apple-rehearsal/$APPLE_PLATFORM.json" build/apple-rehearsal-platform/
      - name: Retain the verified platform rehearsal only
        id: package
        uses: actions/upload-artifact@v4
        with:
          name: APPLE-REHEARSAL-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-rehearsal-platform/
          if-no-files-found: error
          retention-days: 14
      - name: Capture distinct immutable platform artifact IDs
        id: result
        env:
          ARTIFACT_ID: ${{ steps.package.outputs.artifact-id }}
        run: |
          if [ "$APPLE_PLATFORM" = macos-intel ]; then
            echo "intel_artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          else
            echo "silicon_artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          fi
      - name: Retain source test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APPLE-REHEARSAL-tests-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14

  verify:
    needs: [plan, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: ${{ needs.plan.outputs.commit }}
      SOURCE_VERSION: ${{ needs.plan.outputs.version }}
      APPLE_TEAM_ID: ${{ needs.plan.outputs.team_id }}
      APPLE_SIGNING_IDENTITY: ${{ needs.plan.outputs.identity }}
      APPLE_NOTARY_KEY_ID: ${{ needs.plan.outputs.key_id }}
      APPLE_NOTARY_ISSUER_ID: ${{ needs.plan.outputs.issuer_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Require both distinct same-run artifact IDs
        env:
          INTEL_ID: ${{ needs.macos.outputs.intel_artifact_id }}
          SILICON_ID: ${{ needs.macos.outputs.silicon_artifact_id }}
        run: |
          if [[ ! "$INTEL_ID" =~ ^[0-9]+$ || ! "$SILICON_ID" =~ ^[0-9]+$ ||
                "$INTEL_ID" = "$SILICON_ID" ]]; then
            echo 'Both successful native jobs must supply distinct immutable artifact IDs.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.macos.outputs.intel_artifact_id }},${{ needs.macos.outputs.silicon_artifact_id }}
          path: build/apple-rehearsal-result
          merge-multiple: true
      - name: Bind both final packages to the exact source and approved identity
        run: |
          python3 -B scripts/launcher_apple.py rehearsal-verify \
            --version "$SOURCE_VERSION" --commit "$SOURCE_COMMIT" --assets build/apple-rehearsal-result
      - name: Retain the test-only packages for authorized Mac testing
        uses: actions/upload-artifact@v4
        with:
          name: TEST-ONLY-Apple-signed-launcher-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/apple-rehearsal-result/
          if-no-files-found: error
          retention-days: 14
      - name: Report rehearsal evidence without publication
        run: |
          {
            echo '## Apple signing rehearsal passed'
            echo 'Both architectures passed signing, notarization, stapling and Gatekeeper checks.'
            echo 'These are test-only packages for authorized Mac installation/launch/upgrade testing.'
            echo 'No release, tag, candidate branch or version change was created.'
            echo 'Production signing remains separately controlled by APPLE_SIGNING_ENABLED.'
          } >> "$GITHUB_STEP_SUMMARY"
