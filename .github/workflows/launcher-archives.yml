name: Launcher native installers
run-name: Launcher build checks - ${{ github.event_name }} (${{ github.head_ref || github.ref_name }})

on:
  workflow_call:
    inputs:
      source_commit:
        description: "Exact source commit to build and test; defaults to the triggering commit"
        required: false
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/launcher-archives.yml"
      - ".github/workflows/launcher-release.yml"
      - ".github/workflows/launcher-gui-smoke.yml"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "src/**"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/launcher-archives.yml"
      - ".github/workflows/launcher-release.yml"
      - ".github/workflows/launcher-gui-smoke.yml"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "src/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  release-tooling:
    name: Release tooling contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      build_installers: ${{ steps.ci-plan.outputs.build_installers }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - name: Test launcher release tooling without network or publication
        run: python3 -B -m unittest discover -s scripts -p test_launcher_release.py
      - name: Determine whether this exact release candidate already passed installer CI
        id: ci-plan
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: python3 -B scripts/launcher_release.py ci-plan

  installers:
    needs: release-tooling
    if: needs.release-tooling.outputs.build_installers == 'true'
    name: Native installers - ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-2025
            extensions: msi
          - id: linux-x64
            os: ubuntu-24.04
            extensions: deb,rpm
          - id: macos-intel
            os: macos-15-intel
            extensions: pkg
          - id: macos-apple-silicon
            os: macos-15
            extensions: pkg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Install verified WiX 3.14 binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/wix314-binaries.zip"
          $expected = '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'
          $actual = (Get-FileHash -LiteralPath "$env:RUNNER_TEMP/wix314-binaries.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw "WiX archive SHA-256 mismatch: $actual" }
          New-Item -ItemType Directory -Force .tools/wix314 | Out-Null
          Expand-Archive "$env:RUNNER_TEMP/wix314-binaries.zip" -DestinationPath .tools/wix314
          if (!(Test-Path .tools/wix314/candle.exe) -or !(Test-Path .tools/wix314/light.exe)) {
            throw 'WiX binaries are missing after extraction.'
          }

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot

      - name: Build Windows installer (never install)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat "-PbuildIdentifier=$env:SOURCE_COMMIT" buildWindowsInstaller

      - name: Build Linux installers (never install)
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew "-PbuildIdentifier=${SOURCE_COMMIT}" buildDebInstaller buildRpmInstaller

      - name: Build macOS installer (never install)
        if: runner.os == 'macOS'
        shell: bash
        run: ./gradlew "-PbuildIdentifier=${SOURCE_COMMIT}" buildPkgInstaller

      - name: Verify exact installer/checksum pairs without installing
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.id }}
          EXTENSIONS: ${{ matrix.extensions }}
        run: |
          $files = @(Get-ChildItem build/distributions -File |
            Where-Object { $_.Name -match "^MegaMek-Launcher-.+-$([regex]::Escape($env:PLATFORM))\.(msi|deb|rpm|pkg)$" })
          $types = $env:EXTENSIONS.Split(',')
          if ($files.Count -ne $types.Count) { throw "Expected $($types.Count) installer(s), found $($files.Count)." }
          foreach ($type in $types) {
            $matchesForType = @($files | Where-Object Extension -eq ".$type")
            if ($matchesForType.Count -ne 1) { throw "Expected exactly one $type installer." }
            $file = $matchesForType[0]
            if ($file.Length -gt 300MB) { throw "$type exceeds the self-update size limit." }
            $version = [regex]::Match($file.Name, '^MegaMek-Launcher-([0-9]+\.[0-9]+\.[0-9]+)-').Groups[1].Value
            if (!$version) { throw 'Installer filename has no numeric launcher version.' }
            $line = [IO.File]::ReadAllText("$($file.FullName).sha256").Trim()
            $actual = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($line -cne "$actual  $($file.Name)") { throw "$type checksum mismatch." }
            Write-Host "$type SHA-256: $actual"
            if ($type -eq 'msi') {
              # Open the MSI database read-only. Never execute msiexec on CI.
              $installer = New-Object -ComObject WindowsInstaller.Installer
              $database = $installer.OpenDatabase($file.FullName, 0)
              function MsiValues([string]$query) {
                $view = $database.OpenView($query)
                [void]$view.Execute()
                $values = @()
                while ($record = $view.Fetch()) { $values += $record.StringData(1) }
                [void]$view.Close()
                return $values
              }
              $productName = @(MsiValues "SELECT ``Value`` FROM ``Property`` WHERE ``Property``='ProductName'")
              if ($productName.Count -ne 1 -or $productName[0] -cne 'MegaMek Launcher') {
                throw 'MSI Installed Apps identity is incorrect.'
              }
              $upgradeCode = @(MsiValues "SELECT ``Value`` FROM ``Property`` WHERE ``Property``='UpgradeCode'")
              if ($upgradeCode.Count -ne 1 -or $upgradeCode[0] -cne '{616FFD64-0D7F-4FBE-9BB9-63FD6D9D32FA}') {
                throw 'MSI upgrade code changed.'
              }
              $shortcuts = @(MsiValues "SELECT ``Name`` FROM ``Shortcut``")
              if ($shortcuts.Count -ne 2 -or @($shortcuts | Where-Object { $_ -notlike '*|MegaMek Launcher' }).Count -ne 0) {
                throw 'MSI Start Menu/desktop shortcut identity is incorrect.'
              }
              $executables = @(MsiValues "SELECT ``FileName`` FROM ``File``")
              if (@($executables | Where-Object { $_ -like '*|MegaMek Launcher.exe' }).Count -ne 1) {
                throw 'MSI installed executable identity is incorrect.'
              }
              $finish = @(MsiValues "SELECT ``Dialog`` FROM ``Dialog`` WHERE ``Dialog``='Exit'")
              if ($finish.Count -ne 1 -or $finish[0] -cne 'Exit') {
                throw 'MSI interactive finish dialog is missing.'
              }
              $view = $database.OpenView("SELECT ``Event``, ``Argument``, ``Condition`` FROM ``ControlEvent`` WHERE ``Dialog_``='Exit'")
              $view.Execute()
              $launch = $false
              while ($record = $view.Fetch()) {
                if ($record.StringData(1) -eq 'DoAction' -and $record.StringData(2) -eq 'LaunchMegaMekLauncher' -and
                    $record.StringData(3) -eq 'LAUNCH_AFTER_INSTALL = 1 AND UILevel = 5 AND NOT REMOVE') { $launch = $true }
              }
              $view.Close()
              if (!$launch) { throw 'MSI launch must be guarded by interactive finish checkbox.' }
              if (@(MsiValues "SELECT ``Action`` FROM ``InstallExecuteSequence`` WHERE ``Action``='LaunchMegaMekLauncher'").Count -ne 0) {
                throw 'Silent MSI execute sequence must never launch the application.'
              }
              # The packaged JVM must include java.exe for games started by the launcher.
              if (@($executables | Where-Object { $_ -match '(^|\|)java\.exe$' }).Count -lt 1) {
                throw 'MSI runtime is missing java.exe.'
              }
            } elseif ($type -eq 'pkg') {
              $expanded = Join-Path $env:RUNNER_TEMP "mm-launcher-pkg-$env:PLATFORM"
              pkgutil --expand-full $file.FullName $expanded
              if ($LASTEXITCODE -ne 0) { throw 'Could not expand macOS package.' }
              $info = @(Get-ChildItem $expanded -Recurse -File -Filter PackageInfo |
                Where-Object { (Get-Content $_.FullName -Raw) -match 'identifier="org\.megamek\.launcher"' })
              if ($info.Count -ne 1) { throw 'macOS package identity is incorrect.' }
              $parts = $version.Split('.')
              $macVersion = "$([int]$parts[0] + 1).$($parts[1]).$($parts[2])"
              [xml]$packageInfo = Get-Content $info[0].FullName -Raw
              # jpackage receipts use version 0; the Distribution and app carry the app version.
              if ($packageInfo.DocumentElement.Name -cne 'pkg-info' -or
                  $packageInfo.DocumentElement.GetAttribute('identifier') -cne 'org.megamek.launcher') {
                throw 'macOS package receipt identity does not match the launcher.'
              }
              [xml]$distribution = Get-Content (Join-Path $expanded 'Distribution') -Raw
              $declared = @($distribution.SelectNodes('//pkg-ref[@version]'))
              if ($distribution.DocumentType -or $distribution.DocumentElement.Name -cne 'installer-gui-script' -or
                  $declared.Count -ne 1 -or $declared[0].id -cne 'org.megamek.launcher' -or
                  $declared[0].version -cne $macVersion) {
                throw 'macOS distribution does not match the self-update identity/version.'
              }
              $appLauncher = @(Get-ChildItem $expanded -Recurse -File -Filter 'MegaMek Launcher' |
                Where-Object { $_.FullName -match '/MegaMek Launcher\.app/Contents/MacOS/MegaMek Launcher$' })
              if ($appLauncher.Count -ne 1) { throw 'macOS self-update entry point is missing.' }
              $plist = Join-Path $appLauncher[0].Directory.Parent.FullName 'Info.plist'
              $bundleVersion = & /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' $plist
              if ($LASTEXITCODE -ne 0 -or $bundleVersion -cne $macVersion) {
                throw 'macOS bundle version does not match its package.'
              }
              $bundleId = & /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' $plist
              if ($LASTEXITCODE -ne 0 -or $bundleId -cne 'org.megamek.launcher') {
                throw 'macOS bundle identity does not match its package.'
              }
              if (@(Get-ChildItem $expanded -Recurse -File -Filter java |
                Where-Object { $_.FullName -match 'runtime[/\\]Contents[/\\]Home[/\\]bin[/\\]java$' }).Count -lt 1) {
                throw 'macOS package runtime is missing bin/java.'
              }
            } else {
              $packageIdentity = if ($type -eq 'deb') {
                & dpkg-deb --show '--showformat=${Package}\t${Version}\t${Architecture}\n' $file.FullName
              } else {
                & rpm -qp --qf '%{NAME}\t%{VERSION}\t%{RELEASE}\t%{ARCH}\n' $file.FullName
              }
              $expectedIdentity = if ($type -eq 'deb') {
                "megamek-launcher`t${version}`tamd64"
              } else {
                "megamek-launcher`t$version`t1`tx86_64"
              }
              if ($LASTEXITCODE -ne 0 -or $packageIdentity.Trim() -cne $expectedIdentity) {
                throw "$type package identity/version/architecture is incorrect."
              }
              $listing = if ($type -eq 'deb') { & dpkg-deb --contents $file.FullName } else { & rpm -qpl $file.FullName }
              if ($LASTEXITCODE -ne 0) { throw "Could not inspect $type package." }
              if (@($listing | Where-Object { $_ -match '/opt/megamek-launcher/bin/MegaMek Launcher$' }).Count -ne 1) {
                throw "$type self-update entry point is missing."
              }
              if (@($listing | Where-Object { $_ -match '/opt/[^/]+/.*/runtime/bin/java$' }).Count -lt 1) {
                throw "$type runtime is missing bin/java under /opt."
              }
              if (@($listing | Where-Object { $_ -match 'launcher-registry\.json|/MegaMek Launcher/(launcher-registry|games)' }).Count -gt 0) {
                throw "$type package contains mutable user state."
              }
            }
          }

      - name: Upload native installers and SHA-256 files only
        uses: actions/upload-artifact@v4
        with:
          name: MegaMek-Launcher-${{ matrix.id }}-installers
          path: |
            build/distributions/MegaMek-Launcher-*-${{ matrix.id }}.msi
            build/distributions/MegaMek-Launcher-*-${{ matrix.id }}.msi.sha256
            build/distributions/MegaMek-Launcher-*-${{ matrix.id }}.deb
            build/distributions/MegaMek-Launcher-*-${{ matrix.id }}.deb.sha256
            build/distributions/MegaMek-Launcher-*-${{ matrix.id }}.rpm
            build/distributions/MegaMek-Launcher-*-${{ matrix.id }}.rpm.sha256
            build/distributions/MegaMek-Launcher-*-${{ matrix.id }}.pkg
            build/distributions/MegaMek-Launcher-*-${{ matrix.id }}.pkg.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Test source on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:GITHUB_WORKSPACE 'build\test-temp'
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          $env:JAVA_TOOL_OPTIONS = "-Djava.io.tmpdir=$testTemp"
          .\gradlew.bat "-PbuildIdentifier=$env:SOURCE_COMMIT" test

      - name: Test source on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew "-PbuildIdentifier=${SOURCE_COMMIT}" test

      - name: Test source on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build/test-temp"
          export JAVA_TOOL_OPTIONS="-Djava.io.tmpdir=${GITHUB_WORKSPACE}/build/test-temp"
          ./gradlew "-PbuildIdentifier=${SOURCE_COMMIT}" test

      - name: Upload platform test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MegaMek-Launcher-test-reports-${{ matrix.id }}
          path: build/test-results/**/*.xml
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
