name: Publish launcher release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-stable-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      commit: ${{ steps.candidate.outputs.commit }}
      base: ${{ steps.candidate.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate official main source and next unused patch version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/launcher_release.py prepare
      - name: Create repository-scoped release bot token
        id: release-bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.LAUNCHER_RELEASE_APP_ID }}
          private-key: ${{ secrets.LAUNCHER_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: mm-launcher
          permission-contents: write
      - name: Prepare version-only candidate outside main
        id: candidate
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
        run: python3 -B scripts/launcher_release.py candidate

  installers:
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/launcher-archives.yml
    with:
      source_commit: ${{ needs.prepare.outputs.commit }}

  publish:
    needs: [prepare, installers]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: MegaMek-Launcher-*-installers
          path: build/release
          merge-multiple: true
      - name: Validate and publish the complete stable launcher release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          python3 -B scripts/launcher_release.py publish \
            --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" \
            --assets build/release

  finalize:
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: MegaMek-Launcher-*-installers
          path: build/release
          merge-multiple: true
      - name: Create repository-scoped version synchronization token
        id: release-bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.LAUNCHER_RELEASE_APP_ID }}
          private-key: ${{ secrets.LAUNCHER_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: mm-launcher
          permission-contents: write
      - name: Confirm published release and synchronize main
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_BASE: ${{ needs.prepare.outputs.base }}
        run: |
          python3 -B scripts/launcher_release.py finalize \
            --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT" \
            --base "$RELEASE_BASE" --assets build/release
